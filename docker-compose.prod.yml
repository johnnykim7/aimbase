# Aimbase 운영 Docker Compose (deploy.sh로 배포)
# 배포 구조: /home/therecommerce/aimbase/
#   ├── platform-core.jar           (BE 빌드 산출물)
#   ├── docker-compose.yml          (이 파일)
#   ├── .env                        (서버에서 관리, deploy.sh는 건드리지 않음)
#   ├── frontend/                   (FE 정적 파일, 외부 nginx가 서빙)
#   └── python-sidecar/             (RAG 소스, 서버에서 빌드)
#
# 최초 기동: docker compose up -d --build
# 이후 기동: docker compose up -d            (rag 의존성 변경 시 --build)

services:
  # ── Backend (Spring Boot + Claude Code CLI) ──
  api:
    build:
      context: ./backend
      dockerfile: platform-core/Dockerfile
    platform: linux/amd64
    # 좀비 자식 프로세스(claude CLI / git / LSP 등) 자동 회수 — PID 1 tini init.
    # api 가 fork 한 외부 프로세스가 종료 후 reap 안 돼 좀비 누적 → PID 고갈 → Redis fork 실패 마비.
    # init 이 고아 자식을 즉시 reap 하므로 발생 코드 경로와 무관하게 PID 고갈을 영구 차단한다.
    init: true
    restart: unless-stopped
    ports:
      - "8280:8080"
    volumes:
      - ./workspace:/data/workspace
      - ./claude-accounts:/home/appuser/.claude-accounts
      # CR-137 Phase 0: 업로드 스토리지 영속화.
      # LocalStorageService 가 /data/aimbase 아래에 첨부 파일을 쓰는데(application.yml
      # storage.local.base-path) 마운트가 없어 컨테이너 레이어에 기록됐다 → 재배포 시 소실.
      # 24h TTL 이라 지금까진 드러나지 않았을 뿐이고, 영상(수백MB)이 들어오면
      # 컨테이너 디스크가 부풀어 오른다.
      - ./aimbase-storage:/data/aimbase
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      RAG_MCP_URL: http://rag-pipeline:8000
      RAG_MCP_ENABLED: "true"
      RAG_MCP_REQUEST_TIMEOUT_SECONDS: "180"
      CLAUDE_CODE_ENABLED: "true"
      CLAUDE_CODE_TIMEOUT_SECONDS: "600"
      CLAUDE_CODE_MAX_TURNS: "50"
      # CR-111 후속: BE→Runner HTTP timeout 300→660s. 정확도 요구(빠짐없는 fact 추출)로 긴 turn 이
      # 정상(실측: exhaustive 단일 PDF 268s, 4 PDF 작업은 그 이상). turn-timeout(660) 보다 약간 크게 둬
      # turn 이 먼저 끊고 BE 가 그 신호를 받게 함(CR-109 동시발동 회피). 넘으면 retry 이어하기(CR-106).
      ANTHROPIC_CLI_HTTP_TIMEOUT_SECONDS: "660"
      CLAUDE_CODE_WORKING_DIRECTORY: /data/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Python Sidecar — RAG Pipeline MCP Server ──
  rag-pipeline:
    build:
      context: ./python-sidecar
      dockerfile: Dockerfile
    init: true   # 좀비 자식(외부 파싱/OCR 바이너리 등) 자동 회수 — PID 고갈 방지
    restart: unless-stopped
    ports:
      - "8281:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      # api 와 동일 경로로 workspace 공유 → BE 가 패스한 file_path 를 사이드카가 직접 읽음
      - ./workspace:/data/workspace
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      PARSE_DOWNLOAD_TIMEOUT_SEC: "150"
      # parse_document file_path 화이트리스트 (미설정 시 로컬 path 파싱 비활성)
      PARSE_ALLOWED_ROOTS: /data/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sse')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Claude CLI Runner Agent (CR-098) ──
  # adapter='anthropic-cli' chat 시 api 가 http://aimbase-agent:8290/v1/chat 로 호출.
  # 같은 compose 네트워크라 TURN 불필요(agent.turn.enabled=false).
  # claude-accounts 볼륨을 api 와 공유 → 동일 OAuth 계정(config_dir) 사용.
  aimbase-agent:
    build:
      context: ./backend
      dockerfile: aimbase-agent/Dockerfile
    platform: linux/amd64
    init: true   # 좀비 claude CLI 워커 자식 자동 회수 — PID 고갈 방지
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./claude-accounts:/home/appuser/.claude-accounts
      # CR-107 후속: api 와 동일 workspace 마운트. HYBRID 모드의 CLI 내장 Read/Bash 가
      # 작업장 파일(/data/workspace/...)을 직접 읽고, Worker 가 cwd 를 작업장으로 설정한다.
      - ./workspace:/data/workspace
    environment:
      # ── Runner HTTP 서비스 (RunnerProperties: aimbase.runner.*) ──
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_API_KEY: "${RUNNER_API_KEY:-cli-runner-key-bidding-2026}"
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "5"
      # CR-111 후속: turn timeout 300→600s. agent async(600s)와 마개-그릇 정렬 — 이전엔 async 만 600s 라
      # turn 300s 에 먼저 샜다. 정확도 요구로 긴 추론이 정상(실측 268s+). 600s 넘으면 retry 이어하기(CR-106)가 누적 완주.
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      # CR-104: 서버 MCP endpoint(aimbase-server)만 사용 — 도구 출처를 API 경로와 동일화.
      # local stdio MCP(AIMBASE_MCP_JAR)는 제거 — server 와 도구 중복 + allowedTools(mcp__aimbase-server__*)
      # prefix 정합성 깨짐 방지. 정공 A 의 도구는 모두 서버 MCP endpoint 를 거친다.
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      AIMBASE_RUNNER_SERVER_MCP_API_KEY: "${SERVER_MCP_API_KEY:-plat-77111309dc1043758c474444b4a36605}"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-bidding"
      SERVER_PORT: "8290"
      # ── Agent 등록 (AgentProperties: agent.*) ──
      AGENT_NAME: "cli-runner-bidding"
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_API_KEY: "${AGENT_API_KEY:-cli-runner-bidding-register-2026}"
      AGENT_TENANT_ID: "bidding_system"
      AGENT_MCP_PORT: "8291"
      AGENT_TURN_ENABLED: "false"
      # CR-098: TURN 없이 같은 네트워크 직접 호출 — BE 가 이 주소로 /v1/chat 호출
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent:8290"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8290/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Claude CLI Runner Agent (AXOPM 전용 — 이름/테넌트만 분리, OAuth계정·키는 bidding과 공유) ──
  # adapter='anthropic-cli' + config.agent_name='cli-runner-axopm' 인 axopm_companyA 워크플로우 LLM_CALL 라우팅 대상.
  # claude-accounts 볼륨/RUNNER_API_KEY 를 bidding agent 와 공유 → 동일 OAuth 계정·키 사용(요청사항).
  # 이름(AGENT_NAME)·테넌트(AGENT_TENANT_ID)·포트(8292/8293)만 분리. axopm_companyA DB 에 자기 등록(heartbeat).
  aimbase-agent-axopm:
    build:
      context: ./backend
      dockerfile: aimbase-agent/Dockerfile
    platform: linux/amd64
    init: true   # 좀비 claude CLI 워커 자식 자동 회수 — PID 고갈 방지
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./claude-accounts:/home/appuser/.claude-accounts   # bidding 과 동일 OAuth 계정 공유
      - ./workspace:/data/workspace
    environment:
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_API_KEY: "${RUNNER_API_KEY:-cli-runner-key-bidding-2026}"   # 키 공유
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "5"
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      AIMBASE_RUNNER_SERVER_MCP_API_KEY: "${SERVER_MCP_API_KEY:-plat-77111309dc1043758c474444b4a36605}"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-axopm"
      SERVER_PORT: "8292"   # 8290 → 8292 (bidding agent 와 충돌 회피)
      AGENT_NAME: "cli-runner-axopm"   # 이름 분리
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_API_KEY: "${AGENT_API_KEY:-cli-runner-bidding-register-2026}"   # 등록키 공유
      AGENT_TENANT_ID: "axopm_companyA"   # ★ axopm_companyA DB 에 등록 — 라우팅 핵심
      AGENT_MCP_PORT: "8293"   # 8291 → 8293 (충돌 회피)
      AGENT_TURN_ENABLED: "false"
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent-axopm:8292"   # 자기 서비스명:포트
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8292/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Claude CLI Runner Agent (WorkMap 전용 — 이름/테넌트만 분리, OAuth계정·키는 bidding과 공유) ──
  # adapter='anthropic-cli' + config.agent_name='cli-runner-workmap' 인 workmap 워크플로우 LLM_CALL 라우팅 대상.
  # claude-accounts 볼륨/RUNNER_API_KEY 를 bidding agent 와 공유 → 동일 OAuth 계정·키 사용(요청사항).
  # 이름(AGENT_NAME)·테넌트(AGENT_TENANT_ID)·포트(8294/8295)만 분리. workmap DB 에 자기 등록(heartbeat).
  aimbase-agent-workmap:
    build:
      context: ./backend
      dockerfile: aimbase-agent/Dockerfile
    platform: linux/amd64
    init: true   # 좀비 claude CLI 워커 자식 자동 회수 — PID 고갈 방지
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./claude-accounts:/home/appuser/.claude-accounts   # bidding 과 동일 OAuth 계정 공유
      - ./workspace:/data/workspace
    environment:
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_API_KEY: "${RUNNER_API_KEY:-cli-runner-key-bidding-2026}"   # 키 공유
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "5"
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      AIMBASE_RUNNER_SERVER_MCP_API_KEY: "${SERVER_MCP_API_KEY:-plat-77111309dc1043758c474444b4a36605}"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-workmap"
      SERVER_PORT: "8294"   # 8292 → 8294 (기존 agent 와 충돌 회피)
      AGENT_NAME: "cli-runner-workmap"   # 이름 분리
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_API_KEY: "${AGENT_API_KEY:-cli-runner-bidding-register-2026}"   # 등록키 공유
      AGENT_TENANT_ID: "workmap"   # ★ workmap DB 에 등록 — 라우팅 핵심
      AGENT_MCP_PORT: "8295"   # 8293 → 8295 (충돌 회피)
      AGENT_TURN_ENABLED: "false"
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent-workmap:8294"   # 자기 서비스명:포트
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8294/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Claude CLI Runner Agent (bp-wes 전용 — 이름/테넌트만 분리, OAuth계정·키는 bidding과 공유) ──
  # adapter='anthropic-cli' + config.agent_name='cli-runner-bp-wes' 인 bp_wes 워크플로우 LLM_CALL 라우팅 대상.
  # claude-accounts 볼륨/RUNNER_API_KEY 를 bidding agent 와 공유 → 동일 OAuth 계정·키 사용(요청사항).
  # 이름(AGENT_NAME)·테넌트(AGENT_TENANT_ID)·포트(8296/8297)만 분리. bp_wes DB 에 자기 등록(heartbeat).
  aimbase-agent-wes:
    build:
      context: ./backend
      dockerfile: aimbase-agent/Dockerfile
    platform: linux/amd64
    init: true   # 좀비 claude CLI 워커 자식 자동 회수 — PID 고갈 방지
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./claude-accounts:/home/appuser/.claude-accounts   # bidding 과 동일 OAuth 계정 공유
      - ./workspace:/data/workspace
    environment:
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_API_KEY: "${RUNNER_API_KEY:-cli-runner-key-bidding-2026}"   # 키 공유
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "5"
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      # ★ MCP 인증키는 AGENT_TENANT_ID 와 같은 테넌트 것이어야 한다 (CR-123 실측).
      # bidding 키를 공유하면 /mcp/sse 가 bidding_system 으로 인증돼 bp_wes 원격도구가 안 보이고
      # MCP 핸드셰이크가 status=pending 에서 멈춘다.
      AIMBASE_RUNNER_SERVER_MCP_API_KEY: "${WES_SERVER_MCP_API_KEY:-plat-d66bccfc4b954dbc907b31e7ef7a7131}"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-bp-wes"
      SERVER_PORT: "8296"   # 8294 → 8296 (기존 agent 와 충돌 회피)
      AGENT_NAME: "cli-runner-bp-wes"   # 이름 분리
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_API_KEY: "${AGENT_API_KEY:-cli-runner-bidding-register-2026}"   # 등록키 공유
      AGENT_TENANT_ID: "bp_wes"   # ★ bp_wes DB 에 등록 — 라우팅 핵심
      AGENT_MCP_PORT: "8297"   # 8295 → 8297 (충돌 회피)
      AGENT_TURN_ENABLED: "false"
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent-wes:8296"   # 자기 서비스명:포트
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8296/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
