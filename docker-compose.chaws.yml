# 운영 3PL 서버 chaws(3.39.94.112, /home/ubuntu/aimbase) 의 회사용 Aimbase compose(CR-162). ./deploy.sh chaws* 가 서버의 docker-compose.yml 로 올린다.
# 서버에서 고치지 않는다. 고칠 일이 있으면 이 파일을 고치고 배포한다.
# 같은 서버에 운영 3PL 컨테이너가 돌아 모든 컨테이너에 메모리 한도를 두고, 호스트 포트는 127.0.0.1 에만 연다.
# DB 와 Redis 는 운영 bp-postgres, bp-redis 와 나눈다. 문서 검색(rag-pipeline)과 스킬 실행 컨테이너는 쓰지 않아 두지 않는다.
# 비밀값은 서버의 db.env, api.env, agent.env 에 있고 저장소에는 없다. ./deploy.sh chaws-init 이 처음 한 번 만든다.
name: aimbase
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB(aimbase_master). 테넌트 DB 도 이 계정으로 만든다.
    env_file: db.env
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 세션은 24시간 TTL 이라 한도에 닿으면 TTL 있는 키부터 비운다.
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 256m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: aimbase-api:latest
    build:
      context: ./build/backend
      dockerfile: platform-core/Dockerfile
    init: true
    restart: unless-stopped
    env_file: api.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      MASTER_DB_URL: jdbc:postgresql://db:5432/aimbase_master
      TENANT_DB_HOST: db
      TENANT_DB_PORT: "5432"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      RAG_MCP_ENABLED: "false"
      ANTHROPIC_CLI_HTTP_TIMEOUT_SECONDS: "660"
      CLAUDE_CODE_WORKING_DIRECTORY: /data/workspace
      AIMBASE_WORKSPACE_BASE: /data/workspace
      AIMBASE_WORKSPACE_WHITELIST: /data/workspace
    mem_limit: 2g
    # 관리 API 는 맥에서 SSH 터널로만 부른다. bp-wms 는 aimbase-apps 망으로 부른다.
    ports: ["127.0.0.1:8280:8080"]
    volumes:
      - ./claude-accounts:/home/appuser/.claude-accounts
      - ./aimbase-storage:/data/aimbase
      - ./workspace:/data/workspace
    networks:
      default: {}
      aimbase-apps:
        aliases: [aimbase-api]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  aimbase-agent:
    image: aimbase-aimbase-agent:latest
    build:
      context: ./build/backend
      dockerfile: aimbase-agent/Dockerfile
    init: true
    restart: unless-stopped
    # 실행기 호출 키(AIMBASE_RUNNER_API_KEY)와 bp_wms 테넌트 실행기 전용 키(AIMBASE_RUNNER_SERVER_MCP_API_KEY, AGENT_API_KEY 같은 값).
    # PGPASSWORD 는 agent-db.env 에 둔다. 커넥션 안내에 비밀번호를 적지 않아 실행 로그에 남지 않게 한다(59 의 .env.runner-wes 와 같은 방식).
    env_file:
      - agent.env
      - path: agent-db.env
        required: false
    environment:
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "3"
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-bp-wms"
      SERVER_PORT: "8290"
      AGENT_NAME: "cli-runner-bp-wms"
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_TENANT_ID: "bp_wms"
      AGENT_MCP_PORT: "8291"
      AGENT_TURN_ENABLED: "false"
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent:8290"
      # 재배치 계획 · 현장 오류 신고 AI 가 psql 로 운영 3PL DB 를 읽는다. claude_ro 는 SELECT 만 가진 읽기 전용 계정이다(CR-WMS-907).
      PGHOST: "bp-postgres"
      PGPORT: "5432"
      PGDATABASE: "bp_fulfillment"
      PGUSER: "claude_ro"
    # bp-postgres 는 운영 3PL compose 의 망(bp-infra_default)에만 있다.
    networks:
      default: {}
      bp-infra: {}
    mem_limit: 1536m
    # 계정 폴더 work01, work02, work03 을 api 와 같이 붙인다. 연결마다 config.config_dir 로 폴더를 고른다.
    volumes:
      - ./claude-accounts:/home/appuser/.claude-accounts
      - ./workspace:/data/workspace
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8290/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # bp-wes CS 초안과 CS 상세 AI 대화 전용 실행기(CR-173, CR-WES-368). 연결 cli-runner-bp-wes-cs-* 가 이리로 보낸다.
  # 59 의 같은 이름 실행기와 같게 개인정보 칸을 뺀 wes_cs_ai 계정만 쥔다.
  # 계정과 작업 폴더를 aimbase-agent 와 나눈다. 그 폴더의 지난 대화와 산출물에 claude_ro 접속값과 조회 결과가 남는다.
  # 이미지 이름을 따로 두어 이 실행기를 올려도 aimbase-agent 의 이미지가 바뀌지 않는다. ./deploy.sh chaws-agent-wes-cs 로 올린다.
  aimbase-agent-wes-cs:
    image: aimbase-aimbase-agent-wes-cs:latest
    build:
      context: ./build/backend
      dockerfile: aimbase-agent/Dockerfile
    init: true
    restart: unless-stopped
    # 실행기 호출 키(AIMBASE_RUNNER_API_KEY)와 bp_wes 테넌트 실행기 전용 키(AIMBASE_RUNNER_SERVER_MCP_API_KEY, AGENT_API_KEY 같은 값).
    # wes_cs_ai 의 PGPASSWORD 는 agent-wes-cs-db.env 에 둔다.
    # 처음 세우기 전에는 두 파일이 없다. 없어도 다른 서비스를 올릴 때 compose 가 멈추지 않게 required 를 끈다.
    env_file:
      - path: agent-wes-cs.env
        required: false
      - path: agent-wes-cs-db.env
        required: false
    environment:
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "2"
      # 실행기 전체 Claude 프로세스 상한(CR-173 14절). 하나에 170MB 부터 300MB 라 java 와 합쳐 메모리 한도 안에 둔다.
      AIMBASE_RUNNER_MAX_PROCESSES: "2"
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "600"
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-bp-wes-cs"
      SERVER_PORT: "8298"
      AGENT_NAME: "cli-runner-bp-wes-cs"
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_TENANT_ID: "bp_wes"
      AGENT_MCP_PORT: "8299"
      AGENT_TURN_ENABLED: "false"
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent-wes-cs:8298"
      PGHOST: "bp-postgres"
      PGPORT: "5432"
      PGDATABASE: "bp_fulfillment"
      PGUSER: "wes_cs_ai"
    networks:
      default: {}
      bp-infra: {}
    mem_limit: 1536m
    # 계정 폴더 work01, work02 를 붙인다. 연결마다 config.config_dir 로 폴더를 고른다.
    volumes:
      - ./claude-accounts-wes-cs:/home/appuser/.claude-accounts
      - ./workspace-wes-cs:/data/workspace
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8298/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 같은 목소리 음성 생성기(CR-166, CR-167). 모델은 문장이 있을 때만 싣고 일이 없으면 내린다.
  # 운영 3PL 보다 CPU 를 늦게 받는다. 코어 2개와 8개의 문장 시간이 같고, 메모리는 긴 문장까지 8.7GB 다(CR-167 7절).
  # 상한에 걸리면 모델 프로세스만 죽고 창구가 503 으로 답한다(BIZ-140). ./deploy.sh chaws-tts 로 올린다.
  # CR-174 품고 API 변경 수리 실행기. 테넌트 bp_3plgw 전용(BIZ-145). 운영 3PL 의 bp-3plgw 가 부른다.
  # GitHub 토큰(GH_TOKEN), 3PLGW 내부 키(TPLGW_INTERNAL_KEY), 실행기 전용 키는 agent-3plgw.env 에만 둔다. 계정 폴더와 작업장을 bp_wms 실행기와 나눈다.
  # 운영 DB 자격은 주지 않는다. 일꾼 1, 턴 시한은 수리 단계 시한(30분)과 같다.
  aimbase-agent-3plgw:
    image: aimbase-aimbase-agent:latest
    build:
      context: ./build/backend
      dockerfile: aimbase-agent/Dockerfile
    init: true
    restart: unless-stopped
    env_file: agent-3plgw.env
    environment:
      AIMBASE_RUNNER_ENABLED: "true"
      AIMBASE_RUNNER_DEFAULT_MODEL: "claude-sonnet-4-5"
      AIMBASE_RUNNER_MAX_WORKERS: "1"
      AIMBASE_RUNNER_TURN_TIMEOUT_SECONDS: "1800"
      AIMBASE_RUNNER_SERVER_MCP_BASE_URL: "http://api:8080"
      AIMBASE_RUNNER_SERVER_MCP_AGENT_ID: "cli-runner-bp-3plgw"
      SERVER_PORT: "8304"
      AGENT_NAME: "cli-runner-bp-3plgw"
      AGENT_AIMBASE_URL: "http://api:8080"
      AGENT_TENANT_ID: "bp_3plgw"
      AGENT_MCP_PORT: "8305"
      AGENT_TURN_ENABLED: "false"
      AGENT_RUNNER_ENDPOINT: "http://aimbase-agent-3plgw:8304"
      GIT_AUTHOR_NAME: "${REPAIR_GIT_NAME:-aimbase-repair}"
      GIT_AUTHOR_EMAIL: "${REPAIR_GIT_EMAIL:-aimbase-repair@therecommerce.co.kr}"
      GIT_COMMITTER_NAME: "${REPAIR_GIT_NAME:-aimbase-repair}"
      GIT_COMMITTER_EMAIL: "${REPAIR_GIT_EMAIL:-aimbase-repair@therecommerce.co.kr}"
    mem_limit: 1536m
    volumes:
      # 계정 폴더는 aimbase-agent 와 같이 쓴다. 토큰 갱신이 한 곳이어야 하고, 격리는 env 로 나눈 토큰과 키로 충분하다(CR-174)
      - ./claude-accounts:/home/appuser/.claude-accounts
      - ./workspace-3plgw:/data/workspace
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8304/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 같은 목소리 음성 생성기(CR-166, CR-167). 모델은 문장이 있을 때만 싣고 일이 없으면 내린다.
  # 운영 3PL 보다 CPU 를 늦게 받는다. 코어 2개와 8개의 문장 시간이 같고, 메모리는 긴 문장까지 8.7GB 다(CR-167 7절).
  # 상한에 걸리면 모델 프로세스만 죽고 창구가 503 으로 답한다(BIZ-140). ./deploy.sh chaws-tts 로 올린다.
  tts-sidecar:
    image: aimbase-tts-sidecar:latest
    build:
      context: ./build/tts-sidecar
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    volumes:
      - tts-models:/models
    environment:
      TTS_THREADS: "2"
      TTS_IDLE_UNLOAD_SECONDS: "300"
      TTS_LOAD_RETRY_SECONDS: "600"
    cpus: 2
    cpu_shares: 256
    mem_limit: 10g
    memswap_limit: 10g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8310/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

# bp-wms 가 합류하는 망. ./deploy.sh chaws-init 이 만들고 어느 compose 를 내려도 지워지지 않게 밖에 둔다.
networks:
  aimbase-apps:
    external: true
  bp-infra:
    external: true
    name: bp-infra_default

volumes:
  pgdata:
  redisdata:
  tts-models:
