server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aimbase

  servlet:
    multipart:
      # CR-137 Phase 0: 50MB → 100MB (운영 nginx client_max_body_size 100m 과 일치).
      #
      # 기존 50MB 는 앞단 nginx(100m) 보다 작아서, 50~100MB 파일이 nginx 는 통과하고
      # Spring 에서 MaxUploadSizeExceededException 으로 터졌다. 그 구간이 실제 버그다.
      # (CR-133 TranscribeJobController 의 1GB 상한은 애초에 도달 불가였다.)
      #
      # 100MB 근거: 1시간 회의녹음(m4a/opus) 50~120MB, 현장 영상 30초~2분 20~100MB.
      # 무손실 WAV 를 가정하지 않는 한 이 값이면 충분하다.
      # 개별 용도별 상한은 각 컨트롤러/서비스가 따로 건다(이미지 10MB, PDF 32MB).
      # 여기는 그 최대치를 덮는 바깥 울타리 역할만 한다.
      max-file-size: 100MB
      max-request-size: 100MB

  # ─── Master DataSource (테넌트 레지스트리, 구독 관리) ─────────────
  datasource:
    master:
      url: ${MASTER_DB_URL:jdbc:postgresql://localhost:5432/aimbase_master}
      username: ${MASTER_DB_USERNAME:platform}
      password: ${MASTER_DB_PASSWORD:platform}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 10
        minimum-idle: 2
        virtual-threads-executor: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  # Flyway 자동 설정 비활성 — FlywayMultiTenantConfig에서 수동 관리
  flyway:
    enabled: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000ms

  # LLM 채팅은 Connection DB 기반 — Chat 자동설정 제외 (PlatformApplication)
  # Spring AI 임베딩: OPENAI_API_KEY 환경변수 설정 시 EmbeddingModel 자동 생성
  #                   미설정 시 EmbeddingService가 ConditionalOnBean으로 비활성화
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
    # ─── MCP Server SSE 설정 (FlowGuard 교훈 반영) ──────────────────────
    # context-path 사용 시 base-url 필수. 미설정 시 SSE data에 prefix 누락되어 클라이언트 연결 실패.
    mcp:
      server:
        base-url: ${MCP_SERVER_BASE_URL:}
        sse-message-endpoint: /mcp/message
        sse-endpoint: /sse

# Virtual Threads (Java 21)
spring.threads.virtual.enabled: true

# ─── RAG MCP 설정 (Python 사이드카 연동, CR-002) ─────────────────────
rag:
  mcp:
    url: ${RAG_MCP_URL:http://localhost:8000}
    enabled: ${RAG_MCP_ENABLED:false}
    # 사이드카 호출 타임아웃(초). 대용량 PDF parse_document 다운로드+파싱이 30초를 넘기는 사례 대응.
    request-timeout-seconds: ${RAG_MCP_REQUEST_TIMEOUT_SECONDS:180}
    # 사이드카 SSE 세션 워밍업 핑. 재기동/유휴로 죽은 세션을 살려둬 첫 호출 cold-start hang(180초) 예방.
    healthcheck:
      interval-ms: ${RAG_MCP_HEALTHCHECK_INTERVAL_MS:60000}
      initial-delay-ms: ${RAG_MCP_HEALTHCHECK_INITIAL_DELAY_MS:90000}

# ─── Safety MCP 설정 (PII Detection, Sprint 16) ──────────────────────
safety:
  mcp:
    url: ${SAFETY_MCP_URL:http://localhost:8001}
    enabled: ${SAFETY_MCP_ENABLED:false}

# ─── Evaluation MCP 설정 (RAG/LLM 평가, Sprint 17) ───────────────────
evaluation:
  mcp:
    url: ${EVALUATION_MCP_URL:http://localhost:8002}
    enabled: ${EVALUATION_MCP_ENABLED:false}

# ─── Agent MCP 설정 (고급 추론 체인, Sprint 18) ────────────────────────
agent:
  mcp:
    url: ${AGENT_MCP_URL:http://localhost:8003}
    enabled: ${AGENT_MCP_ENABLED:false}

# ─── CR-071 Phase 1: claude-code 블록 삭제 (ClaudeCodeTool / ClaudeCliLlmAdapter 즉시 제거) ─────
# Claude CLI 호출은 Phase 4 ClaudeCliAdapter 가 connection.config 와 AgentRegistry 만으로 라우팅한다.

# ─── CR-072: 서버 도구 MCP endpoint 노출 ────────────────────────────
# /mcp/sse 로 서버 도구 26개를 MCP 채널로 외부(CLI 등)에 노출.
# 도구 분류는 com.platform.mcp.server.McpExposurePolicy (CLI / NONE).
# 인증: SecurityConfig 가 /mcp/** authenticated → ApiKeyAuthenticationFilter 가 X-API-Key 검증 + tenant 자동 결정.
mcp:
  server-exposure:
    enabled: ${MCP_SERVER_EXPOSURE_ENABLED:true}
  rate-limit:
    # 분당 요청 수 (테넌트 단위, MCP 채널 한정 키 스코프 'mcp:{tenantId}'). 0 이면 무제한.
    requests-per-minute: ${MCP_RATE_LIMIT_PER_MINUTE:60}

# ─── Platform 설정 (테넌트 프로비저닝 기본값) ────────────────────────
platform:
  default-db-host: ${TENANT_DB_HOST:localhost}
  default-db-port: ${TENANT_DB_PORT:5432}
  default-db-username: ${TENANT_DB_USERNAME:platform}
  default-db-password: ${TENANT_DB_PASSWORD:platform}
  # ─── 오케스트레이터 설정 ─────────────────────────────────────────────
  orchestrator:
    max-tool-iterations: ${PLATFORM_MAX_TOOL_ITERATIONS:30}
    default-max-tokens: ${PLATFORM_DEFAULT_MAX_TOKENS:16000}
  # ─── CR-071 Phase 1: platform.llm.anthropic-cli 블록 삭제 (in-process Worker 풀 제거) ─────
  # Phase 4 ClaudeCliAdapter 는 connection.config + AgentRegistry 로 Runner 라우팅.
  # ─── CR-106: Runner HTTP 요청 타임아웃 설정화 (장기 AGENT_CALL 대응) ─────
  # BE → aimbase-agent Runner /v1/chat(/stream) 요청 타임아웃(초). 기본 300s.
  # 장기 적재 작업(다수 PDF parse→file_write)이 turn timeout 으로 죽으면 상향 검토.
  # turn timeout 자체는 retry 멱등화(--resume 이어하기)로 작업을 누적 처리하므로 단독 상향은 미봉책.
  llm:
    anthropic-cli:
      http-timeout-seconds: ${ANTHROPIC_CLI_HTTP_TIMEOUT_SECONDS:300}
  # ─── 압축 임계값 (PRD-206, CR-030 Phase 5) ─────────────────────────
  # 퍼센트 단위 (70 = 70%). 환경변수 PLATFORM_*_PCT가 우선.
  compaction:
    snip-percent: 70
    micro-compact-percent: 85
    session-memory-percent: 91
    auto-compact-percent: 93
    blocking-limit-percent: 98
  # ─── CR-066: Tenant Flyway 자동 재실행 ─────────────────────────────
  # auto-migrate-on-startup=true 로 설정하면 ApplicationReadyEvent 시
  # 활성 테넌트 전체에 migrate 수행. 실패는 격리되어 기동을 차단하지 않는다.
  # 기본값 false — 운영 환경에서 사용자 명시 승인 후 켤 것.
  tenant:
    migration:
      auto-migrate-on-startup: ${TENANT_AUTO_MIGRATE_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ─── JWT 설정 ─────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:aimbase-dev-secret-key-change-in-production-min-256-bits!!}
  expiration-ms: 1800000
  refresh-expiration-ms: 604800000

# ─── 스토리지 설정 ────────────────────────────────────────────────────
storage:
  local:
    base-path: ${STORAGE_BASE_PATH:/data/aimbase}

# ─── CR-137: 영상 프레임 추출 + VLM 판독 ──────────────────────────
vision:
  # 원본 영상·추출 프레임 작업 디렉토리. storage.local.base-path 아래에 두어
  # 볼륨 마운트(docker-compose ./aimbase-storage:/data/aimbase) 하나로 영속화된다.
  work-dir: ${VISION_WORK_DIR:/data/aimbase/vision-jobs}
  # 원본 보존 시간(초). 재판독·감사용으로 남기되 100MB 급이라 무한 누적은 막는다(BIZ-114).
  artifact-ttl-seconds: ${VISION_ARTIFACT_TTL_SECONDS:86400}
  ffmpeg:
    ffmpeg-bin: ${VISION_FFMPEG_BIN:ffmpeg}
    ffprobe-bin: ${VISION_FFPROBE_BIN:ffprobe}
    # 입력 seek(-ss 를 -i 앞에) 이라 프레임 1장은 보통 1초 내에 끝난다.
    frame-timeout-seconds: ${VISION_FRAME_TIMEOUT:60}
    probe-timeout-seconds: ${VISION_PROBE_TIMEOUT:30}
    # JPEG 품질 2(고품질)~31(저품질). 판독 정확도와 base64 크기의 균형점.
    jpeg-quality: ${VISION_JPEG_QUALITY:2}
    # ffmpeg 는 CPU 바운드 — 과도한 병렬은 이득 없이 메모리만 먹는다.
    max-concurrent: ${VISION_MAX_CONCURRENT:2}

# ─── CR-045: 워크스페이스 접근 제어 (L0/L1/L2 단일 진실 원천) ────────────
aimbase:
  workspace:
    base: ${AIMBASE_WORKSPACE_BASE:/data/workspaces}
    whitelist-roots:
      - ${AIMBASE_WORKSPACE_WHITELIST:${user.home}/Documents/GitHub/bp-fulfillment-infra}
  # CR-132: CLI 산출물(out/) 다운로드 유예 시간. TTL 초과 mtime 파일은 GC 가 삭제.
  artifact:
    ttl-hours: ${AIMBASE_ARTIFACT_TTL_HOURS:24}
  # CR-092 OCR (Tesseract) — BIZ-105/106/107
  ocr:
    enabled: ${AIMBASE_OCR_ENABLED:true}
    fallback-threshold-chars: ${AIMBASE_OCR_FALLBACK_THRESHOLD:50}
    languages: ${AIMBASE_OCR_LANGUAGES:kor+eng}
    max-pages: ${AIMBASE_OCR_MAX_PAGES:50}
  # CR-095 PDF 비전 파싱 (openclaude 1:1) — 모델 비전으로 PDF 처리
  pdf:
    # 이 크기 이하 & PDF 지원 어댑터 → base64 document block 통째 (모델 직접 비전)
    inline-max-bytes: ${AIMBASE_PDF_INLINE_MAX_BYTES:3145728}      # 3 MB
    # document block 으로 보낼 수 있는 최대 원본 크기 (API 32MB 한계 + base64 33% 여유)
    target-raw-max-bytes: ${AIMBASE_PDF_TARGET_RAW_MAX_BYTES:20971520}  # 20 MB
    # 페이지 이미지화 시 한 번에 변환할 최대 페이지 수
    max-pages-per-read: ${AIMBASE_PDF_MAX_PAGES_PER_READ:20}
    # 페이지 이미지 렌더 해상도 (openclaude pdftoppm -r 100 동일)
    image-dpi: ${AIMBASE_PDF_IMAGE_DPI:100}
    # 페이지 분할 가드 임계 (도구 경로) — 초과 시 통째 처리 대신 모델에게 pages 분할 호출 안내
    # openclaude PDF_AT_MENTION_INLINE_THRESHOLD=10 대응 (CR-095 후속)
    inline-page-threshold: ${AIMBASE_PDF_INLINE_PAGE_THRESHOLD:10}

logging:
  level:
    com.platform: INFO
    com.platform.tenant: DEBUG
    org.springframework.ai: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
