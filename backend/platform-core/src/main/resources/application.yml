server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aimbase

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ─── Master DataSource (테넌트 레지스트리, 구독 관리) ─────────────
  datasource:
    master:
      url: ${MASTER_DB_URL:jdbc:postgresql://localhost:5432/aimbase_master}
      username: ${MASTER_DB_USERNAME:platform}
      password: ${MASTER_DB_PASSWORD:platform}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: master-pool
        maximum-pool-size: 10
        minimum-idle: 2
        virtual-threads-executor: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  # Flyway 자동 설정 비활성 — FlywayMultiTenantConfig에서 수동 관리
  flyway:
    enabled: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000ms

  # LLM 채팅은 Connection DB 기반 — Chat 자동설정 제외 (PlatformApplication)
  # Spring AI 임베딩: OPENAI_API_KEY 환경변수 설정 시 EmbeddingModel 자동 생성
  #                   미설정 시 EmbeddingService가 ConditionalOnBean으로 비활성화
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
    # ─── MCP Server SSE 설정 (FlowGuard 교훈 반영) ──────────────────────
    # context-path 사용 시 base-url 필수. 미설정 시 SSE data에 prefix 누락되어 클라이언트 연결 실패.
    mcp:
      server:
        base-url: ${MCP_SERVER_BASE_URL:}
        sse-message-endpoint: /mcp/message
        sse-endpoint: /sse

# Virtual Threads (Java 21)
spring.threads.virtual.enabled: true

# ─── RAG MCP 설정 (Python 사이드카 연동, CR-002) ─────────────────────
rag:
  mcp:
    url: ${RAG_MCP_URL:http://localhost:8000}
    enabled: ${RAG_MCP_ENABLED:false}

# ─── Safety MCP 설정 (PII Detection, Sprint 16) ──────────────────────
safety:
  mcp:
    url: ${SAFETY_MCP_URL:http://localhost:8001}
    enabled: ${SAFETY_MCP_ENABLED:false}

# ─── Evaluation MCP 설정 (RAG/LLM 평가, Sprint 17) ───────────────────
evaluation:
  mcp:
    url: ${EVALUATION_MCP_URL:http://localhost:8002}
    enabled: ${EVALUATION_MCP_ENABLED:false}

# ─── Agent MCP 설정 (고급 추론 체인, Sprint 18) ────────────────────────
agent:
  mcp:
    url: ${AGENT_MCP_URL:http://localhost:8003}
    enabled: ${AGENT_MCP_ENABLED:false}

# ─── CR-071 Phase 1: claude-code 블록 삭제 (ClaudeCodeTool / ClaudeCliLlmAdapter 즉시 제거) ─────
# Claude CLI 호출은 Phase 4 ClaudeCliAdapter 가 connection.config 와 AgentRegistry 만으로 라우팅한다.

# ─── Platform 설정 (테넌트 프로비저닝 기본값) ────────────────────────
platform:
  default-db-host: ${TENANT_DB_HOST:localhost}
  default-db-port: ${TENANT_DB_PORT:5432}
  default-db-username: ${TENANT_DB_USERNAME:platform}
  default-db-password: ${TENANT_DB_PASSWORD:platform}
  # ─── 오케스트레이터 설정 ─────────────────────────────────────────────
  orchestrator:
    max-tool-iterations: ${PLATFORM_MAX_TOOL_ITERATIONS:30}
    default-max-tokens: ${PLATFORM_DEFAULT_MAX_TOKENS:16000}
  # ─── CR-071 Phase 1: platform.llm.anthropic-cli 블록 삭제 (in-process Worker 풀 제거) ─────
  # Phase 4 ClaudeCliAdapter 는 connection.config + AgentRegistry 로 Runner 라우팅.
  # ─── 압축 임계값 (PRD-206, CR-030 Phase 5) ─────────────────────────
  # 퍼센트 단위 (70 = 70%). 환경변수 PLATFORM_*_PCT가 우선.
  compaction:
    snip-percent: 70
    micro-compact-percent: 85
    session-memory-percent: 91
    auto-compact-percent: 93
    blocking-limit-percent: 98
  # ─── CR-066: Tenant Flyway 자동 재실행 ─────────────────────────────
  # auto-migrate-on-startup=true 로 설정하면 ApplicationReadyEvent 시
  # 활성 테넌트 전체에 migrate 수행. 실패는 격리되어 기동을 차단하지 않는다.
  # 기본값 false — 운영 환경에서 사용자 명시 승인 후 켤 것.
  tenant:
    migration:
      auto-migrate-on-startup: ${TENANT_AUTO_MIGRATE_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ─── JWT 설정 ─────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:aimbase-dev-secret-key-change-in-production-min-256-bits!!}
  expiration-ms: 1800000
  refresh-expiration-ms: 604800000

# ─── 스토리지 설정 ────────────────────────────────────────────────────
storage:
  local:
    base-path: ${STORAGE_BASE_PATH:/data/aimbase}

# ─── CR-045: 워크스페이스 접근 제어 (L0/L1/L2 단일 진실 원천) ────────────
aimbase:
  workspace:
    base: ${AIMBASE_WORKSPACE_BASE:/data/workspaces}
    whitelist-roots:
      - ${AIMBASE_WORKSPACE_WHITELIST:${user.home}/Documents/GitHub/bp-fulfillment-infra}

logging:
  level:
    com.platform: INFO
    com.platform.tenant: DEBUG
    org.springframework.ai: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
