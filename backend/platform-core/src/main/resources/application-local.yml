spring:
  jpa:
    show-sql: true
  data:
    redis:
      password: "263ca230d0de693a57111e8b6ca353967e5582b08bdadccfc0c48e77e95ea4ef"

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}/v1

aimbase:
  workspace:
    # 맥에는 /data 가 없어 기본값(/data/workspaces)으로는 run 작업장을 만들지 못한다.
    # 작업장 뿌리는 화이트리스트 안이어야 하므로 기본 화이트리스트에 같은 경로를 더한다.
    base: ${AIMBASE_WORKSPACE_BASE:${user.home}/aimbase-workspace}
    whitelist-roots:
      - ${AIMBASE_WORKSPACE_WHITELIST:${user.home}/Documents/GitHub/bp-fulfillment-infra}
      - ${AIMBASE_WORKSPACE_BASE:${user.home}/aimbase-workspace}
  # CR-147: 로컬 실행 컨테이너는 포트 레지스트리의 18147. 열쇠는 docker-compose.yml 의 로컬 기본값과 같다.
  skill-sandbox:
    url: ${SKILL_SANDBOX_URL:http://localhost:18147}
    api-key: ${SKILL_SANDBOX_API_KEY:local-skill-sandbox-key}

# Python RAG Pipeline MCP Server
rag:
  mcp:
    url: ${RAG_MCP_URL:http://localhost:8002}
    enabled: ${RAG_MCP_ENABLED:true}

# Python Safety MCP Server (별도 사이드카 미기동)
safety:
  mcp:
    url: ${SAFETY_MCP_URL:http://localhost:8003}
    enabled: ${SAFETY_MCP_ENABLED:false}

# Python Evaluation MCP Server (별도 사이드카 미기동)
evaluation:
  mcp:
    url: ${EVALUATION_MCP_URL:http://localhost:8004}
    enabled: ${EVALUATION_MCP_ENABLED:false}

logging:
  level:
    com.platform: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
